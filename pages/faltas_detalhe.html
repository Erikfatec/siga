<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5D6B7C">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>SIGA | Faltas</title>
</head>
<body class="flex flex-col min-h-screen bg-gray-100">

    <header class="w-full bg-[#5D6B7C] px-4 py-2 flex items-center justify-between">
        <div class="flex items-center gap-x-2">
          <img src="../assets/cpssiga.png" alt="logo" class="h-[88px] w-auto" />
        </div>
        <div class="flex items-center gap-x-2">
          <i class="fa-regular fa-bell text-white text-[20px]"></i>
          <p class="text-white">Olá, KELVIN</p>
          <img src="../assets/kelvin.jpeg" alt="Avatar" class="w-8 h-8 rounded-full object-cover" />
        </div>
    </header>

    <div class="bg-[#E7E3DA] max-w-[450px] mx-auto w-full px-4 py-3 flex items-center gap-3">
        <a href="faltas.html" target="_self" class="text-[#3B4A57] flex items-center gap-1 text-sm">
            <i class="fa-solid fa-chevron-left"></i>
            <span>Voltar</span>
        </a>
        <div>
            <h1 class="text-lg font-bold text-[#2A2A2A] leading-tight">Faltas</h1>
            <p class="text-xs text-[#6B6B6B]">Faltas no semestre</p>
        </div>
    </div>

    <main class="flex-1 max-w-[450px] mx-auto w-full px-4 py-5">
        <div id="detalheFalta"></div>
    </main>

    <footer class="bg-[#2A2A2A] max-w-[450px] mx-auto w-full h-[90px] flex items-center justify-around">
        <div class="text-white flex flex-col items-center">
            <a href="home.html" target="_self" class="flex flex-col items-center transition-all duration-200 hover:scale-105">
                <i class="fa-solid fa-house text-white"></i>
                <p>início</p>
            </a>
        </div>
        <div class="text-white flex flex-col items-center">
            <a href="curso.html" target="_self" class="flex flex-col items-center transition-all duration-200 hover:scale-105">
                <i class="fa-solid fa-school text-white"></i>
                <p>meu curso</p>
            </a>
        </div>
        <div class="text-white flex flex-col items-center">
            <a href="../index.html" target="_self" class="flex flex-col items-center transition-all duration-200 hover:scale-105">
                <i class="fa-solid fa-right-from-bracket text-white"></i>
                <p>sair</p>
            </a>
        </div>
    </footer>

    <script>
        const disciplinasSemestre = [
            { codigo: "IPL120", nome: "Inglês para Logística I", docente: "Rosângela Mara Gagini" },
            { codigo: "TEI245", nome: "Transporte e Intermodalidade", docente: "Carlos Alberto Ferrari" },
            { codigo: "MAT046", nome: "Matemática Aplicada", docente: "Nilo Pereira" },
            { codigo: "CEE077", nome: "Comunicação e Expressão", docente: "Rodrigo Tonale Silveira" },
            { codigo: "QUA103", nome: "Qualidade em Sistemas Logísticos", docente: "Rafael Francisco de Nari" },
            { codigo: "FEC006", nome: "Finanças e Contabilidade", docente: "Luís Gustavo de Souza" },
            { codigo: "GES550", nome: "Gestão de Produção e Operações", docente: "Bruno de Saraiva Paiva" }
        ];

        const params = new URLSearchParams(window.location.search);
        const codigo = params.get("codigo");
        const disciplina = disciplinasSemestre.find(d => d.codigo === codigo) || disciplinasSemestre[0];

        // Semestre recém-iniciado: ainda não há aulas registradas para nenhuma disciplina
        const aulas = 12;
        const presenca = 12;
        const ausencia = 0;
        const frequencia = 100.0;

        const container = document.getElementById("detalheFalta");
        container.innerHTML = `
            <div class="border border-[#ccc] rounded-lg overflow-hidden bg-white">
                <div class="bg-[#5D6B7C] text-white px-4 py-4">
                    <p class="text-xs opacity-80">${disciplina.codigo}</p>
                    <p class="font-bold text-base leading-snug">${disciplina.nome}</p>
                </div>
                <div class="px-4 py-3 text-sm space-y-1.5">
                    <p class="text-[#2A2A2A] mb-2">
                        <span class="font-semibold">Docente:</span> ${disciplina.docente}
                    </p>
                    <div class="flex justify-between">
                        <span class="text-[#6B6B6B]">Aulas</span>
                        <span class="font-bold text-[#2A2A2A]">${aulas}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-[#6B6B6B]">Presença</span>
                        <span class="font-bold text-[#2A2A2A]">${presenca}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-[#6B6B6B]">Ausencia</span>
                        <span class="font-bold text-[#2A2A2A]">${ausencia}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-[#6B6B6B]">Frequência</span>
                        <span class="font-bold text-amber-600">
                            <i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i>${frequencia.toFixed(1)}
                        </span>
                    </div>
                </div>
            </div>
        `;
    </script>
</body>
</html>
