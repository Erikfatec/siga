<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5D6B7C">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>SIGA | Notas</title>
</head>
<body class="flex flex-col min-h-screen bg-gray-100">

    <header class="w-full bg-[#5D6B7C] px-4 py-2 flex items-center justify-between">
        <div class="flex items-center gap-x-2">
          <img src="../assets/cpssiga.png" alt="logo" class="h-[88px] w-auto" />
        </div>
        <div class="flex items-center gap-x-2">
          <i class="fa-regular fa-bell text-white text-[20px]"></i>
          <p class="text-white">Olá, ERIK</p>
          <img src="../assets/erik.jpeg" alt="Avatar" class="w-8 h-8 rounded-full object-cover" />
        </div>
    </header>

    <div class="bg-[#E7E3DA] max-w-[450px] mx-auto w-full px-4 py-3 flex items-center gap-3">
        <a href="notas.html" target="_self" class="text-[#3B4A57] flex items-center gap-1 text-sm">
            <i class="fa-solid fa-chevron-left"></i>
            <span>Voltar</span>
        </a>
        <div>
            <h1 class="text-lg font-bold text-[#2A2A2A] leading-tight">Notas</h1>
            <p class="text-xs text-[#6B6B6B]">Notas lançadas no semestre</p>
        </div>
    </div>

    <main class="flex-1 max-w-[450px] mx-auto w-full px-4 py-5">
        <div id="detalheNota"></div>
    </main>

    <footer class="bg-[#2A2A2A] max-w-[450px] mx-auto w-full h-[90px] flex items-center justify-around">
        <div class="text-white flex flex-col items-center">
            <a href="home.html" target="_self" class="flex flex-col items-center transition-all duration-200 hover:scale-105">
                <i class="fa-solid fa-house text-white"></i>
                <p>início</p>
            </a>
        </div>
        <div class="text-white flex flex-col items-center">
            <a href="curso.html" target="_self" class="flex flex-col items-center transition-all duration-200 hover:scale-105">
                <i class="fa-solid fa-school text-white"></i>
                <p>meu curso</p>
            </a>
        </div>
        <div class="text-white flex flex-col items-center">
            <a href="../index.html" target="_self" class="flex flex-col items-center transition-all duration-200 hover:scale-105">
                <i class="fa-solid fa-right-from-bracket text-white"></i>
                <p>sair</p>
            </a>
        </div>
    </footer>

    <script>
         const disciplinasSemestre = [
            { codigo: "ADG002", nome: "Administração Geral", docente: "HELENA VASCONCELOS" },
            { codigo: "CAC200", nome: "Cálculo", docente: "EDUARDO FONTES" },
            { codigo: "LDP059", nome: "Linguagem de Programação", docente: "BRUNO SIQUEIRA" },
            { codigo: "CEE006", nome: "Comunicação e Expressão", docente: "CLARICE VIANA" },
            { codigo: "ECF099", nome: "Economia e Finanças", docente: "MARCELO TAVARES" },
            { codigo: "BDD045", nome: "Banco de Dados", docente: "BRUNO SIQUEIRA" },
            { codigo: "EDD075", nome: "Estruturas de Dados", docente: "EDUARDO FONTES" }
        ];

        const params = new URLSearchParams(window.location.search);
        const codigo = params.get("codigo");
        const disciplina = disciplinasSemestre.find(d => d.codigo === codigo) || disciplinasSemestre[0];

        const avaliacoes = [
            { nome: "N1", nota: 8 },
            { nome: "N2", nota: null },
            { nome: "N3", nota: null }
        ];

        const container = document.getElementById("detalheNota");
        container.innerHTML = `
            <div class="border border-[#ccc] rounded-lg overflow-hidden bg-white mb-4">
                <div class="bg-[#5D6B7C] text-white px-4 py-4">
                    <p class="text-xs opacity-80">${disciplina.codigo}</p>
                    <p class="font-bold text-base leading-snug">${disciplina.nome}</p>
                    <p class="text-xs opacity-90 mt-1">${disciplina.docente}</p>
                </div>
                <div class="px-4 py-3 text-sm space-y-1.5">
                    ${avaliacoes.map(a => `
                        <div class="flex justify-between">
                            <span class="text-[#6B6B6B]">${a.nome}</span>
                            <span class="font-bold text-[#2A2A2A]">${a.nota !== null ? a.nota.toFixed(1).replace(".", ",") : "—"}</span>
                        </div>
                    `).join("")}
                    <div class="flex justify-between pt-2 border-t border-gray-200 mt-2">
                        <span class="text-[#6B6B6B]">Média</span>
                        <span class="font-bold text-[#2A2A2A]">4,0</span>
                    </div>
                </div>
            </div>
        `;
    </script>
</body>
</html>
