<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5D6B7C">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>SIGA | Histórico</title>
</head>
<body class="flex flex-col min-h-screen bg-gray-100">

    <header class="w-full bg-[#5D6B7C] px-4 py-2 flex items-center justify-between">
        <div class="flex items-center gap-x-2">
          <img src="../assets/cpssiga.png" alt="logo" class="h-[88px] w-auto" />
        </div>
        <div class="flex items-center gap-x-2">
          <i class="fa-regular fa-bell text-white text-[20px]"></i>
          <p class="text-white">Olá, FABIO</p>
          <img src="../assets/fabio.jpeg" alt="Avatar" class="w-8 h-8 rounded-full object-cover" />
        </div>
    </header>

    <div class="bg-[#E7E3DA] max-w-[450px] mx-auto w-full px-4 py-3 flex items-center gap-3">
        <a href="home.html" target="_self" class="text-[#3B4A57] flex items-center gap-1 text-sm">
            <i class="fa-solid fa-chevron-left"></i>
            <span>Voltar</span>
        </a>
        <div>
            <h1 class="text-lg font-bold text-[#2A2A2A] leading-tight">Histórico</h1>
            <p class="text-xs text-[#6B6B6B]">Disciplinas já cursadas</p>
        </div>
    </div>

    <main class="flex-1 max-w-[450px] mx-auto w-full px-4 py-5">

        <div class="flex items-center gap-3 mb-5">
            <i class="fa-solid fa-filter text-[#5D6B7C] text-sm"></i>
            <select id="filtroSemestre" class="flex-1 border border-gray-300 rounded-md px-3 py-2 text-sm text-[#333] bg-white outline-none focus:border-[#5D6B7C]">
                <option value="todos">Todos os semestres</option>
                <option value="1">1º semestre</option>
                <option value="2">2º semestre</option>
                <option value="3">3º semestre</option>
                <option value="4">4º semestre</option>
                <option value="5">5º semestre</option>
            </select>
            <select id="filtroAno" class="w-[110px] border border-gray-300 rounded-md px-3 py-2 text-sm text-[#333] bg-white outline-none focus:border-[#5D6B7C]">
                <option value="todos">Ano</option>
                <option value="20232">2023/2</option>
                <option value="20241">2024/1</option>
                <option value="20242">2024/2</option>
                <option value="20251">2025/1</option>
                <option value="20252">2025/2</option>
            </select>
        </div>

        <div id="listaHistorico" class="space-y-4"></div>

        <p id="vazio" class="hidden text-center text-sm text-[#6B6B6B] py-10">
            Nenhuma disciplina encontrada para este filtro.
        </p>

    </main>

    <footer class="bg-[#2A2A2A] max-w-[450px] mx-auto w-full h-[90px] flex items-center justify-around">
        <div class="text-white flex flex-col items-center">
            <a href="home.html" target="_self" class="flex flex-col items-center transition-all duration-200 hover:scale-105">
                <i class="fa-solid fa-house text-white"></i>
                <p>início</p>
            </a>
        </div>
        <div class="text-white flex flex-col items-center">
            <a href="curso.html" target="_self" class="flex flex-col items-center transition-all duration-200 hover:scale-105">
                <i class="fa-solid fa-school text-white"></i>
                <p>meu curso</p>
            </a>
        </div>
        <div class="text-white flex flex-col items-center">
            <a href="../index.html" target="_self" class="flex flex-col items-center transition-all duration-200 hover:scale-105">
                <i class="fa-solid fa-right-from-bracket text-white"></i>
                <p>sair</p>
            </a>
        </div>
    </footer>

    <script>
        const historico = [
            { codigo: "ECF090", nome: "Economia e Finanças", media: 7.7, frequencia: 100.0, semestre: 1, ano: "20252", status: "aprovado" },
            { codigo: "GPC561", nome: "Gestão de Pessoas e Comportamento Organizacional", media: 8.8, frequencia: 100.0, semestre: 1, ano: "20252", status: "aprovado" },
            { codigo: "FDM830", nome: "Ferramentas de Marketing", media: 8.9, frequencia: 100.0, semestre: 1, ano: "20252", status: "aprovado" },
            { codigo: "LEO794", nome: "Logística e Operações", media: 8.1, frequencia: 100.0, semestre: 1, ano: "20252", status: "aprovado" },
            // { codigo: "ISO011", nome: "Sistemas Operacionais e Redes de Computadores", media: 8.4, frequencia: 100.0, semestre: 1, ano: "20241", status: "aprovado" },
            // { codigo: "ISW031", nome: "Design Digital", media: 9.2, frequencia: 95.0, semestre: 1, ano: "20232", status: "aprovado" },

            // { codigo: "MAT019", nome: "Matemática para Computação", media: 6.5, frequencia: 100.0, semestre: 2, ano: "20241", status: "aprovado" },
            // { codigo: "ISW029", nome: "Desenvolvimento Web II", media: 9.8, frequencia: 100.0, semestre: 2, ano: "20241", status: "aprovado" },
            // { codigo: "IBD015", nome: "Banco de Dados – Relacional", media: 8.1, frequencia: 100.0, semestre: 2, ano: "20241", status: "aprovado" },
            // { codigo: "IED005", nome: "Estrutura de Dados", media: 8.0, frequencia: 100.0, semestre: 2, ano: "20241", status: "aprovado" },
            // { codigo: "IES012", nome: "Engenharia de Software II", media: 7.1, frequencia: 97.5, semestre: 2, ano: "20241", status: "aprovado" },
            // { codigo: "ILP036", nome: "Técnicas de Programação I", media: 9.1, frequencia: 100.0, semestre: 2, ano: "20241", status: "aprovado" },

            // { codigo: "AGO021", nome: "Gestão Ágil de Projetos de Software", media: 9.5, frequencia: 80.0, semestre: 3, ano: "20242", status: "aprovado" },
            // { codigo: "ISW030", nome: "Desenvolvimento Web III", media: 8.7, frequencia: 87.5, semestre: 3, ano: "20242", status: "aprovado" },
            // { codigo: "ING085", nome: "Inglês I", media: 7.1, frequencia: 90.0, semestre: 3, ano: "20242", status: "aprovado" },
            // { codigo: "MAG004", nome: "Álgebra Linear", media: 6.5, frequencia: 90.0, semestre: 3, ano: "20242", status: "aprovado" },
            // { codigo: "ILP037", nome: "Técnicas de Programação II", media: 7.2, frequencia: 95.0, semestre: 3, ano: "20242", status: "aprovado" },
            // { codigo: "IHC004", nome: "Interação Humano Computador", media: 7.5, frequencia: 95.0, semestre: 3, ano: "20242", status: "aprovado" },
            // { codigo: "IBD016", nome: "Banco de Dados - Não relacional", media: 8.7, frequencia: 83.8, semestre: 3, ano: "20242", status: "aprovado" },

            // { codigo: "IHC005", nome: "Experiência do Usuário", media: 9.0, frequencia: 90.0, semestre: 4, ano: "20251", status: "aprovado" },
            // { codigo: "ING086", nome: "Inglês II", media: 8.0, frequencia: 85.0, semestre: 4, ano: "20251", status: "aprovado" },
            // { codigo: "MET004", nome: "Estatística Aplicada", media: 8.0, frequencia: 88.8, semestre: 4, ano: "20251", status: "aprovado" },
            // { codigo: "ISW033", nome: "Laboratório de Desenvolvimento Web", media: 9.6, frequencia: 92.5, semestre: 4, ano: "20251", status: "aprovado" },
            // { codigo: "IAL011", nome: "Internet das Coisas e Aplicações", media: 7.5, frequencia: 82.5, semestre: 4, ano: "20251", status: "aprovado" },

            // { codigo: "ISW034", nome: "Computação em Nuvem I", media: 7.0, frequencia: 90.0, semestre: 5, ano: "20252", status: "aprovado" },
            // { codigo: "MAQ024", nome: "Aprendizagem de Máquina", media: 8.6, frequencia: 97.5, semestre: 5, ano: "20252", status: "aprovado" },
            // { codigo: "POR040", nome: "Fundamentos da Redação Técnica", media: 6.5, frequencia: 95.0, semestre: 5, ano: "20252", status: "aprovado" }
        ];

        const statusConfig = {
            aprovado:  { label: "Aprovado por Nota e Frequência", cor: "text-emerald-600", bg: "bg-[#4A5864]" },
            cursando:  { label: "Em andamento", cor: "text-amber-600", bg: "bg-[#5D6B7C]" },
            reprovado: { label: "Reprovado", cor: "text-red-600", bg: "bg-[#7C4A4A]" }
        };

        function renderHistorico() {
            const semestre = document.getElementById("filtroSemestre").value;
            const ano = document.getElementById("filtroAno").value;
            const lista = document.getElementById("listaHistorico");
            const vazio = document.getElementById("vazio");

            const filtradas = historico.filter(d => {
                const semestreOk = semestre === "todos" || String(d.semestre) === semestre;
                const anoOk = ano === "todos" || d.ano === ano;
                return semestreOk && anoOk;
            });

            lista.innerHTML = "";

            if (filtradas.length === 0) {
                vazio.classList.remove("hidden");
                return;
            }
            vazio.classList.add("hidden");

            filtradas.forEach(d => {
                const cfg = statusConfig[d.status];
                const anoLabel = d.ano.slice(0, 4) + "/" + d.ano.slice(4);

                const card = document.createElement("div");
                card.className = "border border-[#ccc] rounded-lg overflow-hidden bg-white";
                card.innerHTML = `
                    <div class="${cfg.bg} text-white px-4 py-4">
                        <p class="text-xs opacity-80">${d.codigo}</p>
                        <p class="font-bold text-base leading-snug">${d.nome}</p>
                    </div>
                    <div class="px-4 py-3 text-sm space-y-1.5">
                        <div class="flex justify-between">
                            <span class="text-[#6B6B6B]">média</span>
                            <span class="font-bold text-[#2A2A2A]">${d.media.toFixed(1).replace(".", ",")}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-[#6B6B6B]">frequência</span>
                            <span class="font-bold text-[#2A2A2A]">${d.frequencia.toFixed(1).replace(".", ",")}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-[#6B6B6B]">semestre</span>
                            <span class="font-bold text-[#2A2A2A]">${d.semestre}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-[#6B6B6B]">ano</span>
                            <span class="font-bold text-[#2A2A2A]">${anoLabel}</span>
                        </div>
                        <div class="flex justify-between pt-1">
                            <span class="text-[#6B6B6B]">status</span>
                            <span class="font-bold ${cfg.cor}">${cfg.label}</span>
                        </div>
                    </div>
                `;
                lista.appendChild(card);
            });
        }

        document.getElementById("filtroSemestre").addEventListener("change", renderHistorico);
        document.getElementById("filtroAno").addEventListener("change", renderHistorico);

        renderHistorico();
    </script>
</body>
</html>
